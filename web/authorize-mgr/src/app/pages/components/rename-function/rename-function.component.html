<h2 mat-dialog-title>變更功能名稱</h2>
<mat-dialog-content>
  <form [formGroup]="renameFunctionForm" class="form-content">
    <mat-form-field>
      <mat-label>名稱</mat-label>
      <input matInput formControlName="name" required>
      <mat-hint align="end"
        *ngIf="renameFunctionForm.controls['name'].touched && renameFunctionForm.controls['name'].hasError('required')">
        <span class="error-hint">功能名稱不能為空</span>
      </mat-hint>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="cancel()">取消</button>
  <button mat-button (click)="apply()" [disabled]="!renameFunctionForm.valid">套用</button>
</mat-dialog-actions>

<h2 mat-dialog-title>建立角色</h2>
<mat-dialog-content>
  <form [formGroup]="createRoleForm" class="form-content">
    <mat-form-field>
      <mat-label>系統</mat-label>
      <input matInput formControlName="system" required>
      <mat-hint align="end"
        *ngIf="createRoleForm.controls['system'].touched && createRoleForm.controls['system'].hasError('required')">
        <span class="error-hint">系統名稱不能為空</span>
      </mat-hint>
    </mat-form-field>
    <mat-form-field>
      <mat-label>名稱</mat-label>
      <input matInput formControlName="roleName" required>
      <mat-hint align="end"
        *ngIf="createRoleForm.controls['roleName'].touched && createRoleForm.controls['roleName'].hasError('required')">
        <span class="error-hint">群組名稱不能為空</span>
      </mat-hint>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="cancel()">取消</button>
  <button mat-button (click)="apply()" [disabled]="!createRoleForm.valid">套用</button>
</mat-dialog-actions>
